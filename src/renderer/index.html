<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="%VIEWPORT_CONTENT%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AIbox Mobile" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="AIbox Mobile" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' https://artifact-preview.chatboxai.app https://localhost capacitor://localhost; connect-src 'self' https: http://localhost capacitor://localhost ws://localhost; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; form-action 'self'"
    />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>AIbox Mobile</title>
    <script type="module" src="./setup/initial-theme.ts"></script>
    <style>
      html[data-theme="dark"] {
        background-color: #242424;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        display: flex;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        background-color: #fff;
        opacity: 1;
      }
      html[data-theme="dark"] .splash-screen {
        background-color: #242424;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-content {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .splash-screen-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .splash-screen-title {
        color: #343a40;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 18px;
        font-weight: 600;
      }
      html[data-theme="dark"] .splash-screen-title {
        color: #f1f3f5;
      }
      .splash-screen-bottom {
        position: relative;
        width: 100%;
        flex: 3;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div class="splash-screen">
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <img class="splash-screen-logo" src="./static/favicon.png" alt="" />
        <span class="splash-screen-title">AIbox Mobile</span>
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
